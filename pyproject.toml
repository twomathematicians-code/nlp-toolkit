[tool.poetry]
packages = [{include = "src"}]
name = "nlp-toolkit"
version = "2.0.0"
description = "Production-grade NLP microservices: NER, summarization, keyword extraction, language detection, and translation powered by spaCy and HuggingFace transformers."
authors = ["Mahesh Solanki"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111"
uvicorn = {extras = ["standard"], version = "^0.30"}
pydantic = "^2.7"
pydantic-settings = "^2.3"
spacy = "^3.7"
transformers = "^4.40"
torch = "^2.2"
httpx = "^0.27"
pyyaml = "^6.0"
langdetect = "^1.0"
accelerate = ">=0.27.0"
sacremoses = ">=0.1.1"
sentencepiece = ">=0.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
ruff = "^0.5"
black = "^24.4"
datasets = "^2.20"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.black]
target-version = ["py311"]
line-length = 100
