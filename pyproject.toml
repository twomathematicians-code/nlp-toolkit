[tool.poetry]
packages = [{include = "src"}]
name = "nlp-toolkit"
version = "1.0.0"
description = "NLP microservices: NER, summarization, keyword extraction, language detection, and translation powered by spaCy and transformers."
authors = ["Mahesh Solanki"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111"
uvicorn = {extras = ["standard"], version = "^0.30"}
pydantic = "^2.7"
pydantic-settings = "^2.3"
spacy = "^3.7"
transformers = "^4.40"
torch = "^2.2"
httpx = "^0.27"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
black = "^24.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
